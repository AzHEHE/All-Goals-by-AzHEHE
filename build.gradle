plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"all_goals" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.register("progressSelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.allgoals.progress.PlayerGoalProgressSelfTest"
}

tasks.register("versionPolicySelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.allgoals.network.ModVersionPolicySelfTest"
}

tasks.register("worldRunIdentitySelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.allgoals.world.WorldRunIdentitySelfTest"
}

tasks.register("craftingProgressSelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.allgoals.tracking.CraftingProgressSelfTest"
}

tasks.named("test") {
	failOnNoDiscoveredTests = false
}

check.dependsOn progressSelfTest, versionPolicySelfTest, worldRunIdentitySelfTest, craftingProgressSelfTest

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
